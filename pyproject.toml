[project]
authors = [{name = "Bryon Hance", email = "bryon.hance@gmail.com"}]
dependencies = []
name = "arc1_objectness"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
arc1_objectness = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pytorch = ">=2.14.1,<3"
keras = ">=3.15.1,<4"
numpy = ">=2.5.4,<3"
jupyterlab = ">=4.6.6,<5"
matplotlib = ">=3.11.2,<4"
